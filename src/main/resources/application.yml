server:
  port: 18502

spring:
  application:
    name: predicting-ovarian
  profiles:
    active: rpc

model:
  path: ./models
  active: rpc
  rpc-url: http://127.0.0.1:8001
  models:
    fsh: fsh3
    lh:  lh
    hmg: hmg

# H2 数据库
spring.datasource:
  url: jdbc:h2:file:./data/ovarian;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
  driver-class-name: org.h2.Driver
  username: sa
  password:
spring.sql.init.mode: always
spring.sql.init.schema-locations: classpath:schema.sql

logging:
  level:
    root: INFO
    com.hospital.ovarian: DEBUG