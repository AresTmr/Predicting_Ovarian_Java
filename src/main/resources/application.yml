server:
  port: 18502

spring:
  application:
    name: predicting-ovarian
  profiles:
    active: rpc

  # H2 文件库：数据持久化，重启后保留
  datasource:
    url: jdbc:h2:file:./data/ovarian;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    # 建表统一交给 config/SchemaInitializer（它带「已存在则跳过」判断）。
    # 关闭 Spring Boot 自动执行 schema.sql —— 否则它会先于 SchemaInitializer 执行，
    # 绕过后者保护，在已有数据的库上重复执行导致主键冲突、启动失败。
    initialization-mode: never

model:
  path: ./models
  active: rpc
  rpc-url: http://127.0.0.1:8001
  connect-timeout-ms: 3000
  read-timeout-ms: 30000
  models:
    fsh: fsh3
    lh:  lh
    hmg: hmg

logging:
  level:
    root: INFO
    com.hospital.ovarian: DEBUG
